[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whosaid"
version = "0.1.0"
description = "WhoSaid: sender-trust-aware message routing agent, with every tool call gated by AgntID"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    # Pinned to the range agntid-sdk 0.2.0 requires, so phase c can install it.
    "fastmcp>=2.14,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "rich>=13.9,<15",
    # AgntID task-glue SDK (not on PyPI yet): task open/close, _task_id, denial parsing.
    "agntid-sdk @ git+https://github.com/AGNTID-AI/agntid-python.git",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
whosaid = "whosaid.cli:main"

[tool.setuptools.packages.find]
include = ["whosaid*"]

[tool.setuptools.package-data]
whosaid = ["data/demo/*.csv", "data/demo/cache/llm/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*Authlib.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
